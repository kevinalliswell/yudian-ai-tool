name: Release

# release-please keeps a release PR up to date from Conventional Commits.
# Merging that PR creates a draft release and its tag; the draft is only
# published after the full CI suite passes on the release commit and the
# uploaded artifacts (installers, signatures, latest.json) are verified.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      id: ${{ steps.release.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    name: Gate
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}

  build:
    name: Build ${{ matrix.platform }}
    needs: [release-please, test]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # The product name is Chinese; GitHub would mangle it in asset names
      # (it became "AI._0.5.0_..."), so assets get stable ASCII names.
      ASSET_NAME_PATTERN: yudian-ai-tool_[version]_[platform]_[arch][ext]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Enable updater artifacts for release
        run: |
          node -e "const fs = require('fs'); const path = 'src-tauri/tauri.conf.json'; const conf = JSON.parse(fs.readFileSync(path, 'utf8')); conf.bundle ??= {}; conf.bundle.createUpdaterArtifacts = true; fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');"
      - name: Build Windows bundle
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release-please.outputs.id }}
          releaseAssetNamePattern: ${{ env.ASSET_NAME_PATTERN }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - name: Build unsigned macOS bundle
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERTIFICATE != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release-please.outputs.id }}
          releaseAssetNamePattern: ${{ env.ASSET_NAME_PATTERN }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - name: Build signed macOS bundle
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERTIFICATE == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.release-please.outputs.id }}
          releaseAssetNamePattern: ${{ env.ASSET_NAME_PATTERN }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    name: Verify artifacts and publish
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # A green build is not proof the release is usable: check that every
      # installer, signature and the updater manifest actually got uploaded.
      - name: Verify release assets
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/assets.json"
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          node - <<'NODE'
          const fs = require("fs");
          const dir = process.env.RUNNER_TEMP;
          const assets = JSON.parse(fs.readFileSync(`${dir}/assets.json`, "utf8")).assets;
          const names = assets.map((asset) => asset.name);
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          console.log(names.join("\n"));

          const unexpected = names.filter(
            (name) => name !== "latest.json" && !/^yudian-ai-tool_[0-9A-Za-z._-]+$/.test(name),
          );
          if (unexpected.length) fail(`unexpected asset names: ${unexpected.join(", ")}`);
          for (const suffix of [".exe", ".exe.sig", ".dmg", ".app.tar.gz", ".app.tar.gz.sig"]) {
            if (!names.some((name) => name.endsWith(suffix))) fail(`missing *${suffix}`);
          }

          const manifest = JSON.parse(fs.readFileSync(`${dir}/latest.json`, "utf8"));
          if (manifest.version !== process.env.VERSION) {
            fail(`latest.json version ${manifest.version} != ${process.env.VERSION}`);
          }
          const platforms = Object.entries(manifest.platforms ?? {});
          if (!platforms.some(([key]) => key.startsWith("windows"))) fail("latest.json lacks windows");
          if (!platforms.some(([key]) => key.startsWith("darwin"))) fail("latest.json lacks darwin");
          for (const [platform, { url, signature }] of platforms) {
            if (!signature) fail(`${platform} has no signature`);
            const known = assets.some(
              (asset) =>
                asset.apiUrl === url ||
                asset.url === url ||
                asset.name === decodeURIComponent(url.split("/").pop()),
            );
            if (!known) fail(`${platform} points to ${url}, which is not a release asset`);
          }
          console.log(`verified ${names.length} assets and ${platforms.length} updater platforms`);
          NODE
      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest
